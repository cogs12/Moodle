<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --ink: #16213a;
    --muted: #5d6679;
    --line: #dde1ea;
    --accent: #0f7b6c;
    --accent-ink: #ffffff;
    --blunt: #d9822b;
    --harsh: #d6403a;
    --passive_aggressive: #7a4fd1;
    --vague: #2f6fde;
    --unclear_ask: #2f6fde;
    --overly_apologetic: #1a9aa8;
    --fine: #0f7b6c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1424; --surface: #171d33; --ink: #e8ecf7; --muted: #9aa3b8;
      --line: #2a3250; --accent: #3cc2ad; --accent-ink: #08201b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Instrument Sans", system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 34px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .editor { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .layer {
    font: 400 20px/1.6 "Newsreader", Georgia, serif;
    padding: 18px 20px; margin: 0; width: 100%; height: 220px;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
    border: 0; letter-spacing: 0;
  }
  #backdrop { position: absolute; inset: 0; color: transparent; overflow: hidden; pointer-events: none; }
  #input { position: relative; display: block; background: transparent; color: var(--ink); resize: none; outline: none; caret-color: var(--ink); }
  #backdrop mark {
    background: none; color: transparent;
    text-decoration: underline wavy var(--c, var(--blunt));
    text-decoration-thickness: 2px; text-underline-offset: 5px;
  }

  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 14px 0 0; }
  .tones { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .tones button { all: unset; cursor: pointer; padding: 7px 13px; font-size: 14px; color: var(--muted); }
  .tones button + button { border-left: 1px solid var(--line); }
  .tones button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .tones button:focus-visible, .btn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; }
  .btn { cursor: pointer; font: 500 14px "Instrument Sans", sans-serif; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  details { margin-top: 12px; color: var(--muted); font-size: 14px; }
  summary { cursor: pointer; }
  #context { width: 100%; height: 80px; margin-top: 8px; font: 14px "Instrument Sans", sans-serif; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }

  #status { margin: 22px 0 0; min-height: 24px; font-size: 14px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); border-radius: 99px; padding: 1px 9px; font-size: 13px; background: var(--surface); }
  .verdict { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }

  .issues { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
  .issues li { font-size: 15px; padding-left: 12px; border-left: 3px solid var(--c); }
  .issues q { font-family: "Newsreader", Georgia, serif; font-size: 17px; quotes: "\201C" "\201D"; }
  .why { margin: 14px 0 0; font-size: 15px; }

  .options { display: grid; gap: 12px; margin-top: 18px; }
  .option { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .option h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .option p { margin: 0 0 12px; font: 400 18px/1.55 "Newsreader", Georgia, serif; white-space: pre-wrap; }
  .error { color: var(--harsh); }
  @media (prefers-reduced-motion: no-preference) { .option { animation: rise .18s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<main>
  <p class="sub">Autocorrect for how your message sounds, not just how it's spelled.</p>

  <div class="editor">
    <div id="backdrop" class="layer" aria-hidden="true"></div>
    <textarea id="input" class="layer" placeholder="Write a message…" spellcheck="true"></textarea>
  </div>

  <div class="bar">
    <div class="tones" role="group" aria-label="Target tone" id="tones">
      <button data-tone="casual" aria-pressed="false">Casual</button>
      <button data-tone="friendly" aria-pressed="false">Friendly</button>
      <button data-tone="professional" aria-pressed="true">Professional</button>
      <button data-tone="firm" aria-pressed="false">Firm</button>
      <button data-tone="empathetic" aria-pressed="false">Empathetic</button>
    </div>
    <div class="actions">
      <button class="btn" id="example">Try an example</button>
      <button class="btn primary" id="deep">Deep check</button>
    </div>
  </div>

  <details>
    <summary>Add thread context for deep check</summary>
    <textarea id="context" placeholder="Paste the earlier messages in this thread (optional)"></textarea>
  </details>

  <div id="status" role="status" aria-live="polite"></div>
  <ul id="issues" class="issues"></ul>
  <p id="why" class="why" hidden></p>
  <div id="options" class="options"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const input = $("#input"), backdrop = $("#backdrop");
const MODEL_NAMES = { nano: "Nano", super: "Super", ultra: "Ultra" };
const TONE_LABELS = {
  fine: "Reads fine", blunt: "Sounds blunt", harsh: "Sounds harsh",
  passive_aggressive: "Sounds passive-aggressive", vague: "Too vague",
  unclear_ask: "Unclear ask", overly_apologetic: "Overly apologetic",
};
let targetTone = "professional", timer = null, controller = null, seq = 0;

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function drawBackdrop(text, issues = [], tone = "blunt") {
  const ranges = [];
  for (const it of issues) {
    const i = text.indexOf(it.phrase);
    if (i >= 0) ranges.push([i, i + it.phrase.length]);
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let html = "", pos = 0;
  for (const [s, e] of ranges) {
    if (s < pos) continue;
    html += esc(text.slice(pos, s)) + `<mark style="--c:var(--${tone})">${esc(text.slice(s, e))}</mark>`;
    pos = e;
  }
  backdrop.innerHTML = html + esc(text.slice(pos)) + "\u200b";
  backdrop.scrollTop = input.scrollTop;
}

function clearResults() {
  $("#issues").innerHTML = ""; $("#options").innerHTML = ""; $("#why").hidden = true;
}

function showStatus(html) { $("#status").innerHTML = html; }

function render(text, r) {
  const toneVar = r.tone && r.tone !== "fine" ? r.tone : "fine";
  drawBackdrop(text, r.issues, toneVar);
  clearResults();

  const chips = (r.steps || []).map((s) => `<span class="chip">${MODEL_NAMES[s.model]} · ${s.seconds}s</span>`).join("");
  const extra = r.cached ? `<span class="chip">cached</span>` : r.tokens ? `<span class="chip">${r.tokens} tokens</span>` : "";
  const label = TONE_LABELS[r.tone] || r.tone;
  showStatus(`<span class="verdict" style="--c:var(--${toneVar})"><span class="dot"></span>${esc(label)}</span>${chips}${extra}`);

  $("#issues").innerHTML = (r.issues || []).map((i) =>
    `<li style="--c:var(--${toneVar})"><q>${esc(i.phrase)}</q> ${esc(i.problem)}</li>`).join("");

  if (r.explanation) { $("#why").textContent = r.explanation; $("#why").hidden = false; }

  const box = $("#options");
  (r.options || []).forEach((o) => {
    const card = document.createElement("div");
    card.className = "option";
    card.innerHTML = `<h3>${esc(o.label)}</h3><p>${esc(o.text)}</p>`;
    const btn = document.createElement("button");
    btn.className = "btn primary"; btn.textContent = "Use this";
    btn.onclick = () => { input.value = o.text; drawBackdrop(o.text); check(false); input.focus(); };
    card.appendChild(btn);
    box.appendChild(card);
  });
}

async function check(deep) {
  const text = input.value.trim();
  clearTimeout(timer);
  if (controller) controller.abort();
  if (!text) { clearResults(); showStatus(""); return; }
  const mine = ++seq;
  controller = new AbortController();
  showStatus(deep ? "Deep check with Ultra…" : "Checking tone…");
  try {
    const res = await fetch("/api/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ text: input.value, target_tone: targetTone, context: $("#context").value, deep }),
    });
    const data = await res.json();
    if (mine !== seq) return;
    if (!res.ok) throw new Error(data.detail || "Request failed");
    render(input.value, data);
  } catch (err) {
    if (err.name === "AbortError") return;
    showStatus(`<span class="error">${esc(err.message)}</span>`);
  }
}

input.addEventListener("input", () => {
  drawBackdrop(input.value);   // drop stale underlines right away
  clearTimeout(timer);
  timer = setTimeout(() => check(false), 800);   // debounce: one call after the user pauses
});
input.addEventListener("scroll", () => { backdrop.scrollTop = input.scrollTop; });

$("#tones").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  targetTone = b.dataset.tone;
  document.querySelectorAll("#tones button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  if (input.value.trim()) check(false);
});
$("#deep").onclick = () => check(true);
$("#example").onclick = () => {
  input.value = "Per my last email, I already told you the report is late. Can we talk later?";
  drawBackdrop(input.value); check(false);
};
drawBackdrop("");
</script>
</body>
</html>
